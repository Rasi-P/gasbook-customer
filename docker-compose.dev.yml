services:

  customer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      # keep the container's linux node_modules out of the macOS bind mount
      - customer_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      # browser-side URL, so this is the host port the gasbook backend is published on
      VITE_API_BASE_URL: http://localhost:8001/api
    command: bun run dev --host 0.0.0.0 --port 5174

volumes:
  customer_node_modules:
